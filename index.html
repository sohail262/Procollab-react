<body>
  <div id="root">
    <!-- Inline Initial Loader matching React LoadingScreen perfectly -->
    <style>
      .pc-init-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070707;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .pc-init-brand {
        margin-bottom: 2.5rem;
        display: flex;
        align-items: center;
        gap: 0.625rem;
      }

      .pc-init-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pc-init-mark span {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #080a0e;
        line-height: 1;
        margin-top: 1px;
      }

      .pc-init-name {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        font-family: "DM Sans", system-ui, sans-serif;
      }

      .pc-speeder-container {
        position: relative;
        width: 300px;
        height: 120px;
      }

      /* Speeder / Loader styles */
      .pc-speeder-container .loader {
        position: absolute;
        top: 50%;
        left: 50%;
        margin-left: -50px;
        animation: speeder 0.4s linear infinite;
      }

      .pc-speeder-container .loader > span {
        height: 5px;
        width: 35px;
        background: #f51313;
        position: absolute;
        top: -19px;
        left: 60px;
        border-radius: 2px 10px 1px 0;
      }

      .pc-speeder-container .base span {
        position: absolute;
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-right: 100px solid #f3cfcf;
        border-bottom: 6px solid transparent;
      }

      .pc-speeder-container .base span:before {
        content: "";
        height: 22px;
        width: 22px;
        border-radius: 50%;
        background: #f3cfcf;
        position: absolute;
        right: -110px;
        top: -16px;
      }

      .pc-speeder-container .base span:after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: 0 solid transparent;
        border-right: 55px solid #f3cfcf;
        border-bottom: 16px solid transparent;
        top: -16px;
        right: -98px;
      }

      .pc-speeder-container .face {
        position: absolute;
        height: 12px;
        width: 20px;
        background: #f3cfcf;
        border-radius: 20px 20px 0 0;
        transform: rotate(-40deg);
        right: -125px;
        top: -15px;
      }

      .pc-speeder-container .face:after {
        content: "";
        height: 12px;
        width: 12px;
        background: #f51313;
        right: 4px;
        top: 7px;
        position: absolute;
        transform: rotate(40deg);
        transform-origin: 50% 50%;
        border-radius: 0 0 2px 2px;
      }

      .pc-speeder-container .loader > span > span {
        width: 30px;
        height: 1px;
        background: #ffffff;
        position: absolute;
      }

      .pc-speeder-container .loader > span > span:nth-child(1) {
        animation: fazer1 0.2s linear infinite;
      }

      .pc-speeder-container .loader > span > span:nth-child(2) {
        top: 3px;
        animation: fazer2 0.4s linear infinite;
      }

      .pc-speeder-container .loader > span > span:nth-child(3) {
        top: 1px;
        animation: fazer3 0.4s linear infinite;
        animation-delay: -1s;
      }

      .pc-speeder-container .loader > span > span:nth-child(4) {
        top: 4px;
        animation: fazer4 1s linear infinite;
        animation-delay: -1s;
      }

      @keyframes fazer1 {
        0% { left: 0; }
        100% { left: -80px; opacity: 0; }
      }

      @keyframes fazer2 {
        0% { left: 0; }
        100% { left: -100px; opacity: 0; }
      }

      @keyframes fazer3 {
        0% { left: 0; }
        100% { left: -50px; opacity: 0; }
      }

      @keyframes fazer4 {
        0% { left: 0; }
        100% { left: -150px; opacity: 0; }
      }

      @keyframes speeder {
        0% { transform: translate(2px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -3px) rotate(-1deg); }
        20% { transform: translate(-2px, 0px) rotate(1deg); }
        30% { transform: translate(1px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 3px) rotate(-1deg); }
        60% { transform: translate(-1px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-2px, -1px) rotate(1deg); }
        90% { transform: translate(2px, 1px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }

      .pc-speeder-container .longfazers {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .pc-speeder-container .longfazers span {
        position: absolute;
        height: 2px;
        width: 20%;
        background: #ffffff;
      }

      .pc-speeder-container .longfazers span:nth-child(1) {
        top: 20%;
        animation: lf 0.6s linear infinite;
        animation-delay: -5s;
      }

      .pc-speeder-container .longfazers span:nth-child(2) {
        top: 40%;
        animation: lf2 0.8s linear infinite;
        animation-delay: -1s;
      }

      .pc-speeder-container .longfazers span:nth-child(3) {
        top: 60%;
        animation: lf3 0.6s linear infinite;
      }

      .pc-speeder-container .longfazers span:nth-child(4) {
        top: 80%;
        animation: lf4 0.5s linear infinite;
        animation-delay: -3s;
      }

      @keyframes lf {
        0% { left: 200%; }
        100% { left: -200%; opacity: 0; }
      }

      @keyframes lf2 {
        0% { left: 200%; }
        100% { left: -200%; opacity: 0; }
      }

      @keyframes lf3 {
        0% { left: 200%; }
        100% { left: -100%; opacity: 0; }
      }

      @keyframes lf4 {
        0% { left: 200%; }
        100% { left: -100%; opacity: 0; }
      }

      .pc-speeder-container .clouds {
        position: absolute;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .pc-speeder-container .cloud {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        opacity: 0.25;
        animation: moveClouds linear infinite;
      }

      .pc-speeder-container .cloud::before,
      .pc-speeder-container .cloud::after {
        content: "";
        position: absolute;
        background: #fff;
        border-radius: 50%;
      }

      .pc-speeder-container .cloud::before {
        width: 60%;
        height: 60%;
        top: -30%;
        left: 10%;
      }

      .pc-speeder-container .cloud::after {
        width: 40%;
        height: 40%;
        top: -20%;
        left: 50%;
      }

      .pc-speeder-container .cloud1 {
        width: 100px;
        height: 60px;
        top: 15%;
        left: 1400px;
        animation-duration: 2s;
      }

      .pc-speeder-container .cloud2 {
        width: 150px;
        height: 80px;
        top: 35%;
        left: 1600px;
        animation-duration: 3s;
      }

      .pc-speeder-container .cloud3 {
        width: 80px;
        height: 50px;
        top: 20%;
        left: 2000px;
        animation-duration: 4s;
      }

      .pc-speeder-container .cloud4 {
        width: 100px;
        height: 80px;
        top: 70%;
        left: 1100px;
        animation-duration: 3s;
      }

      .pc-speeder-container .cloud5 {
        width: 170px;
        height: 50px;
        top: 80%;
        left: 1500px;
        animation-duration: 2s;
      }

      @keyframes moveClouds {
        0% { transform: translateX(0); }
        100% { transform: translateX(-2000px); }
      }
    </style>
    <div class="pc-init-loader">
      <div class="pc-init-brand">
        <img src="/images/logo_pc.png" alt="ProCollab Logo" style="width: 30px; height: 30px; object-fit: contain;" />
        <span class="pc-init-name">ProCollab</span>
      </div>
      <div class="pc-speeder-container">
        <div class="clouds">
          <div class="cloud cloud1"></div>
          <div class="cloud cloud2"></div>
          <div class="cloud cloud3"></div>
          <div class="cloud cloud4"></div>
          <div class="cloud cloud5"></div>
        </div>
        <div class="loader">
          <span><span></span><span></span><span></span><span></span></span>
          <div class="base">
            <span></span>
            <div class="face"></div>
          </div>
        </div>
        <div class="longfazers">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
