<body>
  <div id="root">
    <!-- Premium Inline Initial Loader (FCP Optimization) -->
    <style>
      .pc-init-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #080a0e;
        margin: 0;
        padding: 0;
      }

      .pc-init-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
      }

      .pc-init-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pc-init-mark span {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #080a0e;
        line-height: 1;
      }

      .pc-init-name {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.4);
        font-family: 'DM Sans', system-ui, sans-serif;
      }

      .pc-init-spinner {
        position: relative;
        width: 40px;
        height: 40px;
        border: 2px solid rgba(99, 102, 241, 0.15);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: pc-spin 0.8s linear infinite;
      }

      @keyframes pc-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div class="pc-init-loader">
      <div class="pc-init-brand">
        <div class="pc-init-mark"><span>P</span></div>

      </div>
      <div class="pc-init-spinner"></div>
